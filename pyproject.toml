[project]
name = "agent-skills"
version = "0.1.0"
description = "agent-skills support scripts"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = [
  "agentskills-ci>=0.1.2",
  "commitizen>=4.16.5",
  "mdlint>=0.2.0",
  "prek>=0.4.10",
  "pytest>=9.1.1",
  "pytest-cov>=7.1.0",
  "ruff>=0.15.12",
  "tombi>=1.2.4",
  "zuban>=0.9.0",
]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "UP"]
ignore = ["ERA001", "E501"]

[tool.uv]
exclude-newer = "1 days"
